<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background: #000;
                overflow: hidden;
            }
            #game {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="game"></div>

        <script>
            EJS_player = "#game";
            EJS_core = "nes";
            EJS_gameName = "The Hyrule Fantasy The Legend of Zelda";
            EJS_color = "#0064ff";
            EJS_startOnLoaded = true;
            EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            
            // 同じフォルダに入れたROMファイルを直接指定するだけ！
            EJS_gameUrl = "Zelda no Densetsu 1 - The Hyrule Fantasy (Japan).nes";
        </script>
        <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    </body>
</html>
